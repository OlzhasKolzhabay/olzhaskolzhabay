<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="AI Engineer Portfolio - Olzhas Kolzhabay">
  <defs>
    <radialGradient id="ts-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#5cffd9" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#5cffd9" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#5cffd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ts-halo-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.03"/>
      <stop offset="1"   stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ts-sphere" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0"   stop-color="#1a2a52"/>
      <stop offset="0.55" stop-color="#0c1330"/>
      <stop offset="1"   stop-color="#040614"/>
    </radialGradient>
    <radialGradient id="ts-shine" cx="0.32" cy="0.26" r="0.32">
      <stop offset="0" stop-color="#c9b9ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ts-shine2" cx="0.66" cy="0.7" r="0.25">
      <stop offset="0" stop-color="#5cffd9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5cffd9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ts-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cffd9" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5cffd9" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ts-panel-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cffd9" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="ts-name-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#cfe9ff"/>
    </linearGradient>
    <filter id="ts-soft">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="ts-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ts-glow-lg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="1200" height="420" fill="#040614"/>

  <!-- ambient corner glows -->
  <circle cx="70" cy="0" r="260" fill="url(#ts-halo-violet)"/>
  <circle cx="1180" cy="420" r="300" fill="url(#ts-halo)"/>

  <!-- Background grid -->
  <g stroke="#0a1230" stroke-width="0.5">
    <line x1="0" y1="60"  x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="100"  y1="0" x2="100"  y2="420"/>
    <line x1="200"  y1="0" x2="200"  y2="420"/>
    <line x1="300"  y1="0" x2="300"  y2="420"/>
    <line x1="400"  y1="0" x2="400"  y2="420"/>
    <line x1="500"  y1="0" x2="500"  y2="420"/>
    <line x1="600"  y1="0" x2="600"  y2="420"/>
    <line x1="700"  y1="0" x2="700"  y2="420"/>
    <line x1="800"  y1="0" x2="800"  y2="420"/>
    <line x1="900"  y1="0" x2="900"  y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
  </g>

  <!-- faint scanning grid highlight, drifts slowly -->
  <g opacity="0.5">
    <rect x="0" y="0" width="1200" height="1" fill="#5cffd9" opacity="0.05">
      <animate attributeName="y" values="0;420;0" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer frame -->
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#131a33" stroke-width="1"/>
  <rect x="14" y="14" width="1172" height="392" fill="none" stroke="#0d1428" stroke-width="1"/>

  <!-- corner ticks -->
  <g stroke="#5cffd9" stroke-width="1" opacity="0.6">
    <path d="M14,34 L14,14 L34,14" fill="none"/>
    <path d="M1166,14 L1186,14 L1186,34" fill="none"/>
    <path d="M1186,386 L1186,406 L1166,406" fill="none"/>
    <path d="M34,406 L14,406 L14,386" fill="none"/>
  </g>

  <!-- ===================== LEFT PANEL ===================== -->
  <g transform="translate(60,74)">

    <!-- glass background card -->
    <rect x="-24" y="-46" width="470" height="330" rx="14" fill="url(#ts-panel-glass)" stroke="#1a2340" stroke-width="1"/>

    <!-- eyebrow -->
    <g font-family="system-ui, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#5cffd9">
      <line x1="0" y1="-10" x2="20" y2="-10" stroke="#5cffd9" stroke-width="0.8"/>
      <text x="28" y="-6">ASPIRING AI PRODUCT ENGINEER</text>
    </g>

    <!-- name -->
    <text y="42" font-family="system-ui, Arial, sans-serif" font-size="50" font-weight="700" fill="url(#ts-name-grad)" letter-spacing="-1">Olzhas Kolzhabay</text>

    <!-- subtitle -->


    <!-- bio -->
    <g font-family="system-ui, Arial, sans-serif" font-size="14" fill="#cbd5e1">
<text y="85">Currently working as a Data Analyst at BI Group.</text>
<text y="110">Third-year Big Data Analysis student at</text>
<text y="135">Astana IT University.</text>
<text y="170">Focused on Artificial Intelligence, AI Agents,</text>
<text y="195">Machine Learning, LLMs and RAG.</text>
<text y="220">Building AI applications with Python,</text>
<text y="245">LangChain, LangGraph and FastAPI.</text>

    </g>
  </g>

  <!-- Vertical separator -->
  <line x1="512" y1="46" x2="512" y2="330" stroke="#1a2238" stroke-width="0.6"/>
  <line x1="512" y1="46" x2="512" y2="374" stroke="#5cffd9" stroke-width="0.6" opacity="0.15"/>

  <!-- ===================== SPHERE — RIGHT ===================== -->
  <g transform="translate(848,210)">

    <!-- Halo -->
    <circle r="230" fill="url(#ts-halo)"/>
    <circle r="150" fill="url(#ts-halo-violet)"/>

    <!-- Sphere base -->
    <circle r="158" fill="url(#ts-sphere)"/>

    <!-- Specular shine -->
    <circle r="158" fill="url(#ts-shine)"/>
    <circle r="158" fill="url(#ts-shine2)"/>

    <!-- Rim light -->
    <circle r="158" fill="none" stroke="url(#ts-rim)" stroke-width="1.4"/>
    <circle r="158" fill="none" stroke="#5cffd9" stroke-width="0.5" opacity="0.25"/>

    <!-- Everything below orbits together with the sphere (single 22s rotation) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>

      <!-- Latitude / Longitude ellipses -->
      <g filter="url(#ts-soft)">
        <!-- longitude lines -->
        <ellipse rx="158" ry="158" fill="none" stroke="#5cffd9" stroke-width="0.6" opacity="0.30"/>
        <ellipse rx="120" ry="158" fill="none" stroke="#5cffd9" stroke-width="0.5" opacity="0.32"/>
        <ellipse rx="60"  ry="158" fill="none" stroke="#5cffd9" stroke-width="0.5" opacity="0.34"/>
        <ellipse rx="158" ry="120" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.30"/>
        <ellipse rx="158" ry="60"  fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.34"/>

        <!-- latitude lines -->
        <ellipse rx="158" ry="58" fill="none" stroke="#5cffd9" stroke-width="0.6" opacity="0.45" transform="rotate(0)"/>
        <ellipse rx="158" ry="58" fill="none" stroke="#5cffd9" stroke-width="0.55" opacity="0.35" transform="rotate(45)"/>
        <ellipse rx="158" ry="58" fill="none" stroke="#a78bfa" stroke-width="0.55" opacity="0.35" transform="rotate(90)"/>
        <ellipse rx="158" ry="58" fill="none" stroke="#5cffd9" stroke-width="0.55" opacity="0.35" transform="rotate(135)"/>
        <ellipse rx="158" ry="18" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>
        <ellipse rx="158" ry="100" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.3"/>
      </g>

      <!-- subtle drifting particles inside sphere -->
      <g clip-path="none" opacity="0.7">
        <circle cx="-60" cy="-40" r="1.4" fill="#5cffd9">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="70" cy="30" r="1.2" fill="#a78bfa">
          <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="-70" r="1.1" fill="#5cffd9">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-30" cy="80" r="1.3" fill="#a78bfa">
          <animate attributeName="opacity" values="1;0.3;1" dur="3.7s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Tech tokens: each orbits with the sphere, but individually counter-rotates so the text label itself never tilts/flips -->
      <g font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="600">

        <g transform="translate(-176,-96)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#5cffd9" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#5cffd9">Python</text>
        </g>

        <g transform="translate(-206,10)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#a78bfa" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#a78bfa">PyTorch</text>
        </g>

        <g transform="translate(-136,118)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#fef3c7" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#fef3c7">LLM</text>
        </g>

        <g transform="translate(-10,182)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#5cffd9" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#5cffd9">FastAPI</text>
        </g>

        <g transform="translate(128,140)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#a78bfa" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#a78bfa">Docker</text>
        </g>

        <g transform="translate(198,40)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#fef3c7" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#fef3c7">RAG</text>
        </g>

        <g transform="translate(184,-82)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#5cffd9" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#5cffd9">SQL</text>
        </g>

        <g transform="translate(58,-178)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite" additive="sum"/>
          <circle r="3.4" fill="#a78bfa" filter="url(#ts-glow-sm)"/>
          <text x="10" y="4.5" fill="#a78bfa">MLOps</text>
        </g>
      </g>
    </g>

    <!-- Center pulsing node -->
    <circle r="5" fill="#fef3c7" filter="url(#ts-glow-lg)">
      <animate attributeName="r" values="5;7.5;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#fef3c7" stroke-width="0.7" opacity="0.5">
      <animate attributeName="r" values="14;24;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#5cffd9" stroke-width="0.5" opacity="0.4">
      <animate attributeName="r" values="8;30;8" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== BOTTOM REGISTER ===================== -->
  <g transform="translate(60,398)" font-family="system-ui, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#5a648b">
    <text>MACHINE LEARNING · LLM · AI ENGINEERING</text>
  </g>
  <text x="1140" y="398" text-anchor="end" font-family="system-ui, Arial, sans-serif" font-size="10" fill="#a78bfa" letter-spacing="3">↻ ROTATION T = 22s</text>

</svg>
